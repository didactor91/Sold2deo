# openspec/config.yaml — Weld Master SDD Configuration
schema: spec-driven

context: |
  Tech stack: Vanilla JS ES2022 + Canvas 2D (frontend) | Node.js + PostgreSQL (backend)
  Architecture: Modular physics/renderer/ui/audio/game/api split per SDD-001
  Testing: Vitest (unit/integration/bench) + Playwright (e2e), V8 coverage
  Style: ESLint + Prettier, no bundler in dev, esbuild for prod bundle only
  Constants: All balance values in /src/config/balance.js (no magic numbers)

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns (native ESM, no npm imports in src/)
    - tdd: true
    - test_command: "npx vitest run"
  verify:
    test_command: "npx vitest run && npx playwright test"
    build_command: "npx esbuild src/main.js --bundle --outfile=public/bundle.js --minify --target=es2022"
    coverage_threshold: 90
  archive:
    - Warn before merging destructive deltas

strict_tdd: true
