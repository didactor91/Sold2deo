version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: weldmaster-db
    environment:
      POSTGRES_USER: weldmaster
      POSTGRES_PASSWORD: weldpass
      POSTGRES_DB: weldmaster
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weldmaster -d weldmaster']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
