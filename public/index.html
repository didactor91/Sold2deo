<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weld Master</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0a'/><circle cx='16' cy='16' r='6' fill='%23ff6b35'/></svg>" />
</head>
<body>
  <div id="game-shell">
    <!-- HUD Bar -->
    <header id="hud">
      <span id="hud-brand">⚡ WELD MASTER</span>
      <nav id="nav-bar">
        <button class="nav-btn active" data-screen="weld">Weld</button>
        <button class="nav-btn" data-screen="factory">Factory</button>
        <button class="nav-btn" data-screen="shop">Shop</button>
      </nav>
      <div id="hud-stats">
        <div class="hud-stat">
          <span class="hud-stat-label">Level</span>
          <span class="hud-stat-value hud-stat-value--level" id="stat-level">1</span>
        </div>
        <div class="hud-stat">
          <span class="hud-stat-label">XP</span>
          <span class="hud-stat-value hud-stat-value--xp" id="stat-xp">0</span>
        </div>
        <div class="hud-stat">
          <span class="hud-stat-label">Ȼ</span>
          <span class="hud-stat-value hud-stat-value--credits" id="stat-credits">100</span>
        </div>
        <div class="hud-stat">
          <span class="hud-stat-label">Quality</span>
          <span class="hud-stat-value" id="stat-quality">—</span>
        </div>
      </div>
    </header>

    <!-- Workspace: Machine Panel + Viewport -->
    <div id="workspace">
      <!-- Machine Control Panel -->
      <aside id="machine-panel">
        <div class="panel-section">
          <div class="panel-section-title">Power</div>
          <div class="power-toggle">
            <span style="font-size:11px;color:var(--text-secondary)">Machine</span>
            <button class="power-btn" id="power-btn" aria-label="Toggle power"></button>
          </div>
        </div>

        <div class="panel-section">
          <div class="panel-section-title">Amperage</div>
          <div class="slider-control">
            <div class="slider-label">
              <span class="slider-label-text">Current</span>
              <span class="slider-label-value" id="amp-value">80 A</span>
            </div>
            <input type="range" id="amp-slider" min="40" max="200" value="80" step="5" />
          </div>
        </div>

        <div class="panel-section">
          <div class="panel-section-title">Duty Cycle</div>
          <div class="slider-label">
            <span class="slider-label-text">Thermal Load</span>
            <span class="slider-label-value" id="duty-value">40%</span>
          </div>
          <div class="duty-bar">
            <div class="duty-bar-fill" id="duty-fill" style="width:40%"></div>
          </div>
        </div>

        <div class="panel-section">
          <div class="panel-section-title">Electrode</div>
          <div class="electrode-selector" id="electrode-selector">
            <button class="electrode-btn active" data-electrode="E6013">
              <span class="electrode-code">E6013</span> — Rutile 2.5mm
            </button>
            <button class="electrode-btn" data-electrode="E7018">
              <span class="electrode-code">E7018</span> — Basic 3.2mm
            </button>
            <button class="electrode-btn" data-electrode="E6010">
              <span class="electrode-code">E6010</span> — Cellulosic 3.2mm
            </button>
          </div>
        </div>

        <div class="panel-section">
          <div class="panel-section-title">Controls</div>
          <div style="font-size:10px;color:var(--text-muted);line-height:1.8;">
            <kbd style="background:#222;padding:2px 6px;border-radius:3px;color:#aaa;">Click</kbd> Strike arc<br/>
            <kbd style="background:#222;padding:2px 6px;border-radius:3px;color:#aaa;">Hold</kbd> Weld<br/>
            <kbd style="background:#222;padding:2px 6px;border-radius:3px;color:#aaa;">C</kbd> Chip slag<br/>
            <kbd style="background:#222;padding:2px 6px;border-radius:3px;color:#aaa;">Esc</kbd> Abort
          </div>
        </div>
      </aside>

      <!-- Game Canvas -->
      <main id="game-viewport">
        <canvas id="game-canvas"></canvas>
      </main>
    </div>
  </div>

  <!-- Shop Modal (hidden by default) -->
  <div id="shop-container"></div>

  <!-- Idle Factory Panel (hidden by default) -->
  <div id="idle-container"></div>

  <!-- Alert Container -->
  <div id="alert-container"></div>

  <script type="module" src="/bundle.js"></script>
</body>
</html>
